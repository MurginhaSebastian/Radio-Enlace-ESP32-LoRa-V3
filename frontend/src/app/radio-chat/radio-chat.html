<div class="flex flex-col h-screen bg-dark-900">
  <!-- Header -->
  <header class="border-b border-dark-500 bg-dark-800/80 backdrop-blur px-6 py-4 flex items-center gap-3 flex-shrink-0">
    <div class="w-2 h-2 rounded-full bg-link-excellent shadow-[0_0_8px_#10b981] animate-pulse"></div>
    <div>
      <h1 class="text-lg font-bold text-white">Radio Chat LoRa</h1>
      <p class="text-xs text-gray-500 font-mono">{{ chat.linkStatus }}</p>
    </div>
  </header>

  <!-- Messages -->
  <div #chatContainer class="flex-1 overflow-y-auto px-6 py-4 space-y-3 scroll-smooth">
    <div *ngFor="let msg of chat.messages"
         class="flex"
         [class.justify-end]="msg.direction === 'sent'"
         [class.justify-start]="msg.direction === 'received'">
      <div class="max-w-[75%] rounded-2xl px-4 py-3 border"
           [class.bg-gradient-to-br]="true"
           [class.from-emerald-600/30]="msg.direction === 'sent'"
           [class.to-emerald-800/30]="msg.direction === 'sent'"
           [class.border-emerald-500/30]="msg.direction === 'sent'"
           [class.from-blue-600/20]="msg.direction === 'received'"
           [class.to-purple-600/20]="msg.direction === 'received'"
           [class.border-blue-500/30]="msg.direction === 'received'">
        <p class="text-sm text-gray-100 leading-relaxed break-words">{{ msg.text }}</p>
        <div class="flex items-center gap-2 mt-1.5">
          <span class="text-[10px] text-gray-500 font-mono">{{ msg.timestamp | date:'HH:mm:ss' }}</span>
          <span *ngIf="msg.rssi != null" class="text-[10px] text-emerald-400/70 font-mono">
            RSSI {{ msg.rssi }} dBm &middot; SNR {{ msg.snr?.toFixed(1) }} dB
          </span>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="chat.messages.length === 0" class="flex items-center justify-center h-full">
      <p class="text-gray-600 font-mono text-sm">No hay mensajes aun. Escribe algo para comenzar.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="border-t border-dark-500 bg-dark-800/80 px-6 py-4 flex gap-3 flex-shrink-0">
    <input
      type="text"
      class="flex-1 bg-dark-700 border border-dark-500 rounded-xl px-4 py-2.5 text-sm text-gray-100 placeholder-gray-600 outline-none transition-all duration-200 focus:border-emerald-500/50 focus:shadow-[0_0_12px_rgba(16,185,129,0.15)]"
      placeholder="Escribe un mensaje..."
      [(ngModel)]="inputText"
      (keydown)="onKeyEnter($event)"
      autofocus
    />
    <button
      class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-700 disabled:text-gray-500 rounded-xl text-sm font-semibold text-white transition-all duration-200 shadow-[0_0_12px_rgba(16,185,129,0.2)] hover:shadow-[0_0_18px_rgba(16,185,129,0.35)]"
      (click)="sendMessage()"
      [disabled]="!inputText.trim()">
      Enviar
    </button>
  </div>
</div>
